<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-root=".">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>مواقيت الصلاة | نور الحياة</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages-unified.css?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="icon" href="imges/logo.ico" />
  </head>
  <body>
    <site-header></site-header>

    <main class="main page-main">
      <section class="prayer-hero page-hero">
        <div class="prayer-hero-pattern"></div>
        <div class="prayer-label">مواقيت اليوم</div>
        <h1 class="prayer-name">أوقات الصلاة - حسب موقعك</h1>
        <p class="page-hero-text">
          تابع الصلاة القادمة ومواقيت الصلوات اليومية بتصميم موحد مع نور الحياة.
        </p>
        <div class="prayer-mosq-icon">🕐</div>
      </section>

      <section class="prayer-times-container">
        <div class="page-panel prayer-times-header">
          <h1>أوقات الصلاة - حسب موقعك</h1>
          <p class="prayer-subtitle">الصلاة عماد الدين</p>
          <div class="next-prayer">
            <span class="next-prayer-text">الصلاة القادمة</span>
            <span class="next-prayer-name">جاري التحميل...</span>
            <span class="countdown">--:--:--</span>
          </div>
        </div>

        <div class="prayer-times-grid">
          <div class="prayer-time-card" data-prayer="fajr" data-time-type="day">
            <div class="prayer-icon"></div>
            <div class="prayer-name">الفجر</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
          <div
            class="prayer-time-card"
            data-prayer="sunrise"
            data-time-type="day"
          >
            <div class="prayer-icon"></div>
            <div class="prayer-name">الشروق</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
          <div
            class="prayer-time-card"
            data-prayer="dhuhr"
            data-time-type="day"
          >
            <div class="prayer-icon"></div>
            <div class="prayer-name">الظهر</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
          <div class="prayer-time-card" data-prayer="asr" data-time-type="day">
            <div class="prayer-icon"></div>
            <div class="prayer-name">العصر</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
          <div
            class="prayer-time-card"
            data-prayer="maghrib"
            data-time-type="night"
          >
            <div class="prayer-icon"></div>
            <div class="prayer-name">المغرب</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
          <div
            class="prayer-time-card"
            data-prayer="isha"
            data-time-type="night"
          >
            <div class="prayer-icon"></div>
            <div class="prayer-name">العشاء</div>
            <div class="prayer-time">
              <span class="time-value">--:--</span
              ><span class="time-period"></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <bottom-nav></bottom-nav>

    <script src="js/site-ui.js"></script>
    <script src="js/prayer-times.js"></script>
    <script src="js/components.js"></script>
  </body>
</html>
